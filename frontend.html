<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<title>Campus Part-Time Job Finder</title>

<style>

body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background:#f7f6ff;
}

header{
    background:#cdb4db;
    text-align:center;
    padding:25px;
}

.logo{
    font-size:40px;
}

header h1{
    color:#3a3a3a;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

form{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #e0c3fc;
}

button{
    background:#bde0fe;
    border:none;
    padding:12px;
    width:100%;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#a2d2ff;
}

.job-card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-left:6px solid #ffc8dd;
    border-radius:10px;
}

.section-title{
    color:#6d597a;
    margin-top:30px;
}

footer{
    text-align:center;
    padding:15px;
    background:#cdb4db;
    margin-top:30px;
}

</style>
</head>

<body>

<header>
<div class="logo">🎓💼</div>
<h1>Campus Part-Time Job Finder</h1>
<p>Safe • Flexible • Student Friendly</p>
</header>

<div class="container">

<h2>Find Your Ideal Job</h2>

<!-- 🔥 Connected to Flask Backend -->
<form id="jobForm">

<label>Name</label>
<input type="text" name="name" placeholder="Enter your name" required>

<label>College Timing</label>
<select name="timing" required>
<option value="">Select Timing</option>
<option>Morning</option>
<option>Afternoon</option>
<option>Flexible</option>
</select>

<label>Preferred Job Type</label>
<select name="jobType" required>
<option value="">Select Job Type</option>
<option>Online Work</option>
<option>Teaching</option>
<option>Store Assistant</option>
<option>Freelancing</option>
</select>

<button type="submit">Search Jobs</button>

</form>

<h2 class="section-title">🎯 Recommended Jobs</h2>

<div id="jobResults"></div>

</div>

<footer>
<p>© 2026 Campus Job Finder | Student Safety First</p>
</footer>

<!-- ========================= -->
<!-- JAVASCRIPT CONNECTION -->
<!-- ========================= -->

<script>

document.getElementById("jobForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const name = document.querySelector("input[name='name']").value;
    const timing = document.querySelector("select[name='timing']").value;
    const jobType = document.querySelector("select[name='jobType']").value;

    fetch("http://127.0.0.1:5000/search", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            timing: timing,
            job_type: jobType
        })
    })
    .then(res => res.json())
    .then(data => {

        const results = document.getElementById("jobResults");
        results.innerHTML = "";

        if(data.length === 0){
            results.innerHTML = "<p>No matching jobs found.</p>";
            return;
        }

        data.forEach(job => {

            const card = document.createElement("div");
            card.className = "job-card";

            card.innerHTML = `
                <h3>${job.title}</h3>
                <p><strong>Location:</strong> ${job.location}</p>
                <p><strong>Timing:</strong> ${job.timing}</p>
                <p><strong>Pay:</strong> ₹${job.pay}</p>
                <button onclick="applyJob(${job.id}, '${name}')">
                    Apply
                </button>
            `;

            results.appendChild(card);
        });

    })
    .catch(error => {
        alert("Error connecting to backend server");
        console.error(error);
    });

});


function applyJob(jobId, name){

    fetch(`http://127.0.0.1:5000/apply/${jobId}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ name: name })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
    })
    .catch(error => {
        alert("Application failed");
        console.error(error);
    });

}

</script>

</body>
</html>
