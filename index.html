<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<title>Campus Part-Time Job Finder</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: #f7f6ff;
}
header {
    background: #cdb4db;
    text-align: center;
    padding: 25px;
}
.logo { font-size: 40px; }
header h1 { color: #3a3a3a; }
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}
form {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid #e0c3fc;
    box-sizing: border-box;
}
button {
    background: #bde0fe;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
}
button:hover { background: #a2d2ff; }
.job-card {
    background: white;
    padding: 15px;
    margin-top: 15px;
    border-left: 6px solid #ffc8dd;
    border-radius: 10px;
}
.job-card button {
    margin-top: 10px;
    width: auto;
    padding: 8px 20px;
}
.section-title { color: #6d597a; margin-top: 30px; }
footer {
    text-align: center;
    padding: 15px;
    background: #cdb4db;
    margin-top: 30px;
}
</style>
</head>
<body>

<header>
    <div class="logo">🎓💼</div>
    <h1>Campus Part-Time Job Finder</h1>
    <p>Safe • Flexible • Student Friendly</p>
</header>

<div class="container">

    <h2>Find Your Ideal Job</h2>

    <form id="jobForm" novalidate>
        <label>Name</label>
        <input type="text" id="nameInput" placeholder="Enter your name" required>

        <label>College Timing</label>
        <select id="timingSelect">
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Flexible">Flexible</option>
        </select>

        <label>Preferred Job Type</label>
        <select id="jobTypeSelect">
            <option value="Online Work">Online Work</option>
            <option value="Teaching">Teaching</option>
            <option value="Store Assistant">Store Assistant</option>
            <option value="Freelancing">Freelancing</option>
        </select>

        <button type="submit">Search Jobs</button>
    </form>

    <h2 class="section-title">🎯 Available Jobs</h2>
    <div id="dynamicResults"></div>

</div>

<footer>
    <p>© 2026 Campus Job Finder | Student Safety First</p>
</footer>

<script>
    const form = document.getElementById("jobForm");
    const results = document.getElementById("dynamicResults");
    const nameInput = document.getElementById("nameInput");
    const timingSelect = document.getElementById("timingSelect");
    const jobTypeSelect = document.getElementById("jobTypeSelect");

    // Load all jobs on page load
    fetch("http://127.0.0.1:3000/jobs")
        .then(res => res.json())
        .then(data => displayJobs(data))
        .catch(err => {
            console.error("Failed to load jobs:", err);
            results.innerHTML = "<p>Could not load jobs. Make sure the backend is running.</p>";
        });

    // Search form submit — prevent reload and URL change
    form.addEventListener("submit", function(e) {
        e.preventDefault();   // stops page reload / URL change
        e.stopPropagation();  // prevents any bubbling that could trigger navigation

        const name    = nameInput.value.trim();
        const timing  = timingSelect.value;
        const jobType = jobTypeSelect.value;

        if (!name) {
            alert("Please enter your name before searching.");
            return;
        }

        fetch("http://127.0.0.1:3000/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name:     name,
                timing:   timing,
                job_type: jobType
            })
        })
        .then(res => {
            if (!res.ok) throw new Error("Server error: " + res.status);
            return res.json();
        })
        .then(data => displayJobs(data))
        .catch(error => {
            console.error("Search error:", error);
            alert("Backend connection error. Please make sure the server is running.");
        });

        return false; // extra safety for older browsers
    });

    function displayJobs(data) {
        results.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
            results.innerHTML = "<p>No matching jobs found.</p>";
            return;
        }

        data.forEach(job => {
            const card = document.createElement("div");
            card.className = "job-card";

            card.innerHTML = `
                <h3>${job.title}</h3>
                <p>Location: ${job.location}</p>
                <p>Timing: ${job.timing}</p>
                <p>Job Type: ${job.job_type}</p>
                <p>Pay: ${job.pay}</p>
            `;

            // Create Apply button via DOM (avoids inline onclick issues)
            const applyBtn = document.createElement("button");
            applyBtn.type = "button";
            applyBtn.textContent = "Apply";
            applyBtn.addEventListener("click", function() {
                applyJob(job.id);
            });

            card.appendChild(applyBtn);
            results.appendChild(card);
        });
    }

    function applyJob(jobId) {
        const name = nameInput.value.trim();

        if (!name) {
            alert("Please enter your name before applying.");
            return;
        }

        fetch(`http://127.0.0.1:3000/apply/${jobId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name })
        })
        .then(res => {
            if (!res.ok) throw new Error("Server error: " + res.status);
            return res.json();
        })
        .then(data => alert(data.message))
        .catch(error => {
            console.error("Apply error:", error);
            alert("Could not submit application. Please try again.");
        });
    }
</script>

</body>
</html>
